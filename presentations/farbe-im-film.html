### Farbmodelle im Computer

* RGB (Rot, Grün, Blau)
* YCbCr (Helligkeit, Blau-Gelb Differenz, Rot-Grün Differenz)
* CMYK (Cyan, Magenta, Gelb, Schwarz - nur für Print relevant)

---

### Bildsensor

![CCD](farbe-im-film/ccd.gif)

---

### Farbräume

* Kameras, Monitore, Projektoren haben alle unterschiedliche Farbcharakteristika
* Normierte Farbräume (Internet: sRGB, HD Video: Rec 709, Digitale Filmprojektion: DCI-P3)

![sRGB gamut](http://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Cie_Chart_with_sRGB_gamut_by_spigget.png/537px-Cie_Chart_with_sRGB_gamut_by_spigget.png)

---

### Farbtiefe / Bittiefe

* Fast alle Consumertechnik 8 Bit pro Farbkanal (256 Werte pro Farbkanal, ca 16 Mio Farbwerte insgesamt)
* Raw Formate höhere Bittiefe
* Gradingsoftware intern ebenfalls
