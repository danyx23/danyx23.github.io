# Reveal.js
### HTML Presentations Made Easy

<small>Created by [Hakim El Hattab](http://hakim.se) / [@hakimel](http://twitter.com/hakimel)</small>

---

## Heads Up

reveal.js is a framework for easily creating beautiful presentations using HTML.

You'll need a browser with support for CSS 3D transforms to see it in its full glory.

## Vertical Slides

Slides can be nested inside of each other.

Use the *Space* key to navigate through all slides.

⬇️

---

## Basement Level 1

Nested slides are useful for adding additional detail underneath a high level horizontal slide.

---

## Basement Level 2

That's it, time to go back up.

⬆️

## Point of View

Press **ESC** to enter the slide overview.

Hold down the **alt** key (**ctrl** in Linux) and click on any element to zoom towards it.

---

## Markdown Support

Write content in pure Markdown using the `data-markdown` attribute.

```markdown
## Slide Title

- Bullet point 1
- Bullet point 2
- Bullet point 3
```

---

## Fragment Example

Hit the next arrow...

... to step through ... <!-- .element: class="fragment" -->

... fragments <!-- .element: class="fragment" -->

## Slide Backgrounds

Set `data-background-color="#417203"` on a slide to change the background color.

All CSS color formats are supported.

---

## Color Background

`data-background-color="rgb(70, 70, 255)"`

---

## Gradient Background

`data-background-gradient="linear-gradient(...)"`

## Pretty Code

```javascript []
import React, { useState } from 'react';

function Example() {
  const [count, setCount] = useState(0);

  return (
    &lt;div&gt;
      &lt;p&gt;You clicked {count} times&lt;/p&gt;
      &lt;button onClick={() =&gt; setCount(count + 1)}&gt;
        Click me
      &lt;/button&gt;
    &lt;/div&gt;
  );
}
```

Code syntax highlighting courtesy of [highlight.js](https://highlightjs.org/).
